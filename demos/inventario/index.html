<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grano · Almacén (demo)</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="preload" href="fonts/plex-condensed-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="4" fill="#0f6b3f"/><ellipse cx="16" cy="16" rx="7" ry="10.5" fill="#f2e8cf" transform="rotate(28 16 16)"/><path d="M12.2 9.6c3.6 3.2 4.4 8.6 7.6 12.8" stroke="#0f6b3f" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-box" viewBox="0 0 20 20"><path d="M3 6.5 10 3l7 3.5v7L10 17l-7-3.5zM3 6.5 10 10l7-3.5M10 10v7"/></symbol>
    <symbol id="i-swap" viewBox="0 0 20 20"><path d="M4 7h11l-3-3M16 13H5l3 3"/></symbol>
    <symbol id="i-truck" viewBox="0 0 20 20"><path d="M2 5h10v8H2zM12 8h3.5L18 11v2h-6"/><circle cx="5.5" cy="14.5" r="1.5"/><circle cx="14.5" cy="14.5" r="1.5"/></symbol>
    <symbol id="i-search" viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></symbol>
    <symbol id="i-x" viewBox="0 0 20 20"><path d="m5 5 10 10M15 5 5 15"/></symbol>
  </svg>

  <div class="shell">
    <nav class="rail" aria-label="Secciones">
      <a class="brand" href="./"><svg><use href="#logo"/></svg><span>Grano<small>distribución</small></span></a>
      <button type="button" data-view="stock" aria-current="page"><svg><use href="#i-box"/></svg>Existencias</button>
      <button type="button" data-view="movs"><svg><use href="#i-swap"/></svg>Movimientos</button>
      <button type="button" data-view="pedido"><svg><use href="#i-truck"/></svg>Pedido a proveedores <b id="n-pedido">0</b></button>
      <p class="rail-foot">Almacén central<br>Nave 4 · Muelles 1–3</p>
      <a class="demo" href="/">Demo de Folzia · empresa ficticia</a>
    </nav>

    <div class="work">
      <header class="bar">
        <h1 id="titulo">Existencias</h1>
        <label class="search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar producto o referencia" autocomplete="off"></label>
        <span class="user">Turno de mañana · <b>R. Gil</b></span>
      </header>

      <section class="view" id="stock">
        <dl class="kpis" id="kpis"></dl>
        <div class="filters" id="filters" role="tablist">
          <button type="button" data-f="todo" aria-pressed="true">Todo</button>
          <button type="button" data-f="bajo" aria-pressed="false">Bajo mínimo</button>
          <button type="button" data-f="agotado" aria-pressed="false">Agotado</button>
          <span class="sep"></span>
          <select id="cat" aria-label="Categoría"></select>
        </div>
        <table class="grid">
          <thead><tr><th>Ref.</th><th>Producto</th><th>Categoría</th><th>Ubicación</th><th class="num">Stock</th><th>Nivel</th><th>Último mov.</th><th></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </section>

      <section class="view" id="movs" hidden>
        <table class="grid">
          <thead><tr><th>Fecha</th><th>Tipo</th><th>Ref.</th><th>Producto</th><th class="num">Cantidad</th><th>Usuario</th><th>Nota</th></tr></thead>
          <tbody id="mov-rows"></tbody>
        </table>
      </section>

      <section class="view" id="pedido" hidden>
        <div class="order" id="order"></div>
      </section>
    </div>

    <aside class="drawer" id="drawer" hidden aria-labelledby="d-name">
      <header><div><small id="d-sku"></small><h2 id="d-name"></h2></div><button type="button" class="close" id="d-close" aria-label="Cerrar"><svg><use href="#i-x"/></svg></button></header>
      <dl class="d-facts" id="d-facts"></dl>
      <h3>Últimos 30 días</h3>
      <svg class="spark" id="spark" viewBox="0 0 300 70" preserveAspectRatio="none" aria-hidden="true"></svg>
      <form class="d-form" id="d-form">
        <h3>Registrar movimiento</h3>
        <div class="seg"><label><input type="radio" name="tipo" value="entrada" checked><span>Entrada</span></label><label><input type="radio" name="tipo" value="salida"><span>Salida</span></label></div>
        <label class="fld"><span>Cantidad</span><input name="cant" type="number" min="1" max="9999" value="10" required></label>
        <label class="fld"><span>Nota</span><input name="nota" maxlength="60" placeholder="Albarán, cliente…"></label>
        <button type="submit" class="btn">Registrar</button>
      </form>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
