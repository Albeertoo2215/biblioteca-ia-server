<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lúa café · Pide desde tu mesa (demo)</title>
  <meta name="theme-color" content="#1c2541">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preload" href="fonts/shrikhand.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#1c2541"/><path d="M29.5 11.5a13 13 0 1 0 7 21.5 11 11 0 0 1-7-21.5z" fill="#f6c453"/><path d="M33 9.5c-1.4 1.6 1.4 3.2 0 4.8M37.5 11c-1.4 1.6 1.4 3.2 0 4.8" stroke="#f4ecdc" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-cafe" viewBox="0 0 48 48"><path d="M10 20h22v9a10 10 0 0 1-10 10h-2a10 10 0 0 1-10-10z"/><path d="M32 23h3a4.5 4.5 0 0 1 0 9h-3.5"/><path d="M17 9c-1.6 2 1.6 4 0 6M23 9c-1.6 2 1.6 4 0 6"/></symbol>
    <symbol id="i-desayuno" viewBox="0 0 48 48"><path d="M10 25c-3-1-3-9 4-10 2-4 18-4 20 0 7 1 7 9 4 10v13H10z"/><path d="M16 30h16"/></symbol>
    <symbol id="i-dulce" viewBox="0 0 48 48"><path d="M7 30c2-9 9-15 17-15s15 6 17 15c-4 2-7 2-9-1-2 3-5 4-8 4s-6-1-8-4c-2 3-5 3-9 1z"/><path d="M18 17l2 12M30 17l-2 12M24 15v14"/></symbol>
    <symbol id="i-zumo" viewBox="0 0 48 48"><path d="M13 14h22l-3 26H16z"/><path d="M14.5 24h19"/><path d="M27 14l5-8 4 1"/></symbol>
    <symbol id="i-luna-0" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
    <symbol id="i-luna-1" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" class="lit"/></symbol>
    <symbol id="i-luna-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" class="lit"/></symbol>
  </svg>

  <header class="top">
    <a class="brand" href="./" aria-label="Lúa café"><svg class="brand-mark"><use href="#logo"/></svg><span class="brand-name">Lúa</span><span class="brand-sub">café<br>de barrio</span></a>
    <label class="stamp"><span>Mesa</span><select id="mesa" aria-label="Número de mesa"></select></label>
  </header>

  <nav class="switch" aria-label="Vista">
    <button type="button" data-view="carta" aria-current="page">La carta</button>
    <button type="button" data-view="cocina">Barra y cocina <b id="pending">0</b></button>
  </nav>

  <main>
    <section class="view" id="carta" aria-label="Carta">
      <div id="tracker"></div>
      <nav class="cats" id="cats" aria-label="Categorías"></nav>
      <div id="menu"></div>
      <p class="demo">Demo de <a href="/">Folzia</a>. Lúa no existe: los pedidos se guardan solo en tu navegador.</p>
    </section>

    <section class="view kitchen" id="cocina" hidden aria-labelledby="t-cocina">
      <div class="kitchen-head">
        <h1 id="t-cocina">Comandas</h1>
        <p>Abre la carta en otra pestaña o en el móvil: los pedidos entran aquí al momento.</p>
      </div>
      <div class="rail">
        <div class="col"><h2>Entran <span id="n-nuevo">0</span></h2><ul id="col-nuevo"></ul></div>
        <div class="col"><h2>En marcha <span id="n-preparando">0</span></h2><ul id="col-preparando"></ul></div>
        <div class="col"><h2>A servir <span id="n-listo">0</span></h2><ul id="col-listo"></ul></div>
      </div>
    </section>
  </main>

  <button class="bag" id="cart-bar" type="button" hidden>
    <span class="bag-qty" id="cart-qty">0</span><span class="bag-txt">Ver la cuenta</span><strong id="cart-total">0,00 €</strong>
  </button>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="receipt" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <button type="button" class="x" data-close aria-label="Cerrar">×</button>
      <p class="r-brand">LÚA CAFÉ</p>
      <h2 id="sheet-title">MESA <span id="sheet-mesa"></span> · <span id="sheet-hora"></span></h2>
      <ul class="r-lines" id="lines"></ul>
      <p class="r-total"><span>TOTAL</span><strong id="r-total"></strong></p>
      <label class="r-note"><span>NOTA PARA LA BARRA (opcional)</span><textarea id="nota" maxlength="140" rows="2" placeholder="Sin azúcar, bebida de avena…"></textarea></label>
      <button class="send" type="button" id="send">Enviar a la barra</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js" defer></script>
</body>
</html>
