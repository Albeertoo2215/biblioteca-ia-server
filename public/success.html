<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="robots" content="noindex">
  <title>Gracias por tu compra</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="nav" aria-label="Principal">
    <div class="wrap"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Tienda</a><ul class="nav-links"><li><a href="/#catalogo">Productos</a></li></ul></div>
  </nav>
  <main class="center">
    <div class="check" id="check" hidden aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="title">Comprobando tu pago…</h1>
    <p class="sub" id="sub">Un momento.</p>
    <div class="downloads" id="downloads"></div>
    <p id="back" hidden><a class="link-more" href="/">Volver a la tienda</a></p>
    <p class="error" id="error" role="alert"></p>
  </main>
  <footer>
    <div class="wrap"><p>Guarda esta página en favoritos: puedes volver a descargar desde este mismo enlace.</p></div>
  </footer>
  <script type="module">
    const id = new URLSearchParams(location.search).get('session_id');
    const $ = (s) => document.getElementById(s);
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    try {
      const res = await fetch('/api/order?session_id=' + encodeURIComponent(id));
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      $('check').hidden = false;
      $('title').textContent = 'Gracias por tu compra.';
      $('sub').textContent = 'Tus archivos están listos.';
      $('downloads').innerHTML = data.items.map((p) => `
        <div class="dl"><div><b>${esc(p.name)}</b><span>${esc(p.tagline)}</span></div>
        <a class="btn" href="/api/download?session_id=${encodeURIComponent(id)}&product=${encodeURIComponent(p.slug)}">Descargar</a></div>`).join('');
    } catch (e) {
      $('title').textContent = 'No encontramos tu pago.';
      $('sub').textContent = 'Si acabas de pagar, espera unos segundos y recarga la página.';
      $('error').textContent = e.message;
    }
    $('back').hidden = false;
  </script>
</body>
</html>
