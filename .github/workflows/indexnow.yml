# Avisa a Bing, Yandex y el resto de buscadores con IndexNow cada vez que se publica la web.
# La clave es pública por diseño: el buscador la comprueba en https://folzia.com/<clave>.txt
name: Avisar a buscadores (IndexNow)

on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esperar a que Cloudflare publique los cambios
        run: sleep 150
      - name: Enviar las páginas del mapa del sitio
        run: |
          KEY=b83a74d04ea6a5130d20fb87fbbbe7eb
          URLS=$(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed 's/<[^>]*>//g' | jq -R . | jq -s -c .)
          BODY=$(jq -n -c --arg key "$KEY" --argjson urls "$URLS" '{host:"folzia.com", key:$key, keyLocation:("https://folzia.com/"+$key+".txt"), urlList:$urls}')
          echo "$BODY"
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" -w '\nHTTP %{http_code}\n'
